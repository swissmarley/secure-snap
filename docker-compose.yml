version: '3.8'

services:
  redis:
    image: redis:7
    container_name: securesnap_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - securesnap-net

  postgres:
    image: postgres:15-alpine
    container_name: securesnap_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - securesnap-net

  backend:
    build:
      context: ./backend
    container_name: securesnap_backend
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: ${PGDATABASE}
      PGPORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis
      - postgres
    ports:
      - "3993:3000"
    networks:
      - securesnap-net
    volumes:
      - ./backend:/usr/src/app
      - backend_node_modules:/usr/src/app/node_modules
    command: sh -c "node db/init.js && node index.js"

  frontend:
    image: nginx:1.25
    container_name: securesnap_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8993:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - securesnap-net

volumes:
  pgdata:
  backend_node_modules:

networks:
  securesnap-net:
    driver: bridge
